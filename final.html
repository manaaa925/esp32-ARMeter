<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AR Flow Anim (Step1)</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <script src="https://unpkg.com/p5ble@0.0.7/dist/p5.ble.js"></script>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; }
    #hud {
      position: absolute; top: 10px; left: 10px; z-index: 1000;
      background: rgba(0, 0, 0, 0.6); padding: 10px; border-radius: 8px; color: white; pointer-events: none;
    }
    #status { font-size: 14px; margin-bottom: 5px; font-weight: bold; }
    .status-ok { color: #00FF00; }
    .status-ng { color: #FF3B30; }
    #graphCanvas { background: rgba(0, 0, 0, 0.3); border: 1px solid #888; display: block; }
    #connectBtn {
      position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
      padding: 15px 30px; font-size: 18px; font-weight: bold; color: white;
      background-color: #007AFF; border: none; border-radius: 30px;
      z-index: 2000; pointer-events: auto; cursor: pointer;
    }
  </style>
</head>

<body>
  <button id="connectBtn">Connect ESP32</button>

  <div id="hud">
    <div id="status">Status: <span id="statusText" class="status-ng">Disconnected</span></div>
    <canvas id="graphCanvas" width="300" height="150"></canvas>
    <div style="font-size:10px; color:#ccc; margin-top:2px;">Red: Voltage / Blue: Current</div>
  </div>

  <a-scene embedded arjs='sourceType: webcam; detectionMode: mono_and_matrix; matrixCodeType: 3x3; debugUIEnabled: false;'>
    
    <a-marker type='barcode' value='6'>
       <a-text value="Circuit Monitor" color="cyan" rotation="-90 0 0" align="center" scale="1.5 1.5 1.5"></a-text>
    </a-marker>


    <a-marker type='barcode' value='0'>
       <a-text value="Resistor" color="yellow" position="0 0.02 -0.6" rotation="-90 0 0" align="center" scale="1.5 1.5 1.5"></a-text>
       <a-text id="currText" value="--- mA" color="yellow" position="0 0.02 0" rotation="-90 0 0" align="center" scale="3 3 3"></a-text>
       <a-text id="resText" value="R: --- ohm" color="#00FF00" position="0 0.02 0.6" rotation="-90 0 0" align="center" scale="2.5 2.5 2.5"></a-text>

       <a-entity id="electronFlow" visible="false"> <a-sphere color="yellow" radius="0.015" position="0 0.02 0">
             <a-animation attribute="position" from="0 0.02 0" to="-0.15 0.02 0" dur="2000" repeat="indefinite" easing="linear"></a-animation>
           </a-sphere>
           <a-sphere color="yellow" radius="0.015" position="0 0.02 0">
             <a-animation attribute="position" from="0 0.02 0" to="-0.15 0.02 0" dur="2000" delay="666" repeat="indefinite" easing="linear"></a-animation>
           </a-sphere>
           <a-sphere color="yellow" radius="0.015" position="0 0.02 0">
             <a-animation attribute="position" from="0 0.02 0" to="-0.15 0.02 0" dur="2000" delay="1333" repeat="indefinite" easing="linear"></a-animation>
           </a-sphere>
       </a-entity>
       </a-marker>


    <a-marker type='barcode' value='1'>
       <a-text value="LED" color="white" position="0 0.02 -0.3" rotation="-90 0 0" align="center" scale="1.5 1.5 1.5"></a-text>
       <a-text id="voltText" value="--- V" color="#FF3B30" position="0 0.02 0.3" rotation="-90 0 0" align="center" scale="3 3 3"></a-text>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const serviceUuid = "4FAF0001-A428-4034-B095-81E5B9420000";
    const targetUuid  = "BEB5483E-36E1-4688-B7F5-EA07361B26A8";
    let myBLE, myCharacteristic;
    let dataHistory = []; const maxDataPoints = 100;

    function setup() {
      noCanvas();
      myBLE = new p5ble();
      const connectBtn = select("#connectBtn");
      if (connectBtn) connectBtn.mousePressed(connectToBle);
      drawGraph();
    }

    function connectToBle() {
      myBLE.connect(serviceUuid, gotCharacteristics);
    }

    function gotCharacteristics(error, characteristics) {
      if (error) { console.error(error); return; }
      select("#connectBtn").hide();
      const statusText = select("#statusText");
      statusText.html("Connected");
      statusText.class("status-ok");
      for (let i = 0; i < characteristics.length; i++) {
        if (characteristics[i].uuid.toLowerCase() == targetUuid.toLowerCase()) {
          myCharacteristic = characteristics[i];
          setInterval(readDataLoop, 500);
          break;
        }
      }
    }

    function readDataLoop() {
      if (myBLE.isConnected() && myCharacteristic) {
        myBLE.read(myCharacteristic, 'string', handleData);
      } else {
        const statusText = select("#statusText");
        if(statusText) { statusText.html("Disconnected"); statusText.class("status-ng"); }
      }
    }

    function handleData(error, data) {
      if (error || !data) return;
      let values = String(data).split(',');
      if (values.length >= 2) {
        let rawVoltage = parseFloat(values[0]);
        let rawCurrent = parseFloat(values[1]);

        let current_mA = (rawCurrent * 1000).toFixed(2);
        document.querySelectorAll('#voltText').forEach(el => el.setAttribute('value', rawVoltage + " V"));
        document.querySelectorAll('#currText').forEach(el => el.setAttribute('value', current_mA + " mA"));

        let resistanceText = "---";
        if (rawCurrent > 0.00001) { 
            let resistance = rawVoltage / rawCurrent;
            resistanceText = resistance.toFixed(0) + " ohm";
        } else {
            resistanceText = "MAX";
        }
        document.querySelectorAll('#resText').forEach(el => el.setAttribute('value', "R: " + resistanceText));

        // ★★★ アニメーションの制御（ON/OFF） ★★★
        const flowEntity = document.querySelector('#electronFlow');
        if (flowEntity) {
            // 電流が少しでも流れていれば表示する
            if (rawCurrent > 0.0001) { // 0.1mA以上
                flowEntity.setAttribute('visible', 'true');
            } else {
                flowEntity.setAttribute('visible', 'false');
            }
        }
        // ★★★★★★★★★★★★★★★★★★★★★

        dataHistory.push({ v: rawVoltage, c: rawCurrent });
        if (dataHistory.length > maxDataPoints) dataHistory.shift();
        drawGraph();
      }
    }

    function drawGraph() {
      const canvas = document.getElementById('graphCanvas');
      const ctx = canvas.getContext('2d');
      const w = canvas.width; const h = canvas.height;
      ctx.clearRect(0, 0, w, h);
      ctx.strokeStyle = '#444'; ctx.lineWidth = 1; ctx.beginPath();
      for(let i=1; i<4; i++) { let y = (h / 4) * i; ctx.moveTo(0, y); ctx.lineTo(w, y); }
      ctx.stroke();
      if (dataHistory.length < 2) return;
      const maxVolt = 3.5; const maxCurr = 0.02; 
      ctx.beginPath(); ctx.strokeStyle = '#FF3B30'; ctx.lineWidth = 2;
      for (let i = 0; i < dataHistory.length; i++) {
        let x = (i / (maxDataPoints - 1)) * w; let y = h - (dataHistory[i].v / maxVolt) * h;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
      ctx.beginPath(); ctx.strokeStyle = '#007AFF'; ctx.lineWidth = 2;
      for (let i = 0; i < dataHistory.length; i++) {
        let x = (i / (maxDataPoints - 1)) * w;
        let val = dataHistory[i].c; if (val > maxCurr) val = maxCurr;
        let y = h - (val / maxCurr) * h;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
  </script>
</body>
</html>
