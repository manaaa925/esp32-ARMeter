<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AR Circuit Monitor - Final Thesis Edition</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <script src="https://unpkg.com/p5ble@0.0.7/dist/p5.ble.js"></script>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    /* ページの基本設定: 余白をなくし、スクロールを無効化（全画面ARのため） */
    body { margin: 0; overflow: hidden; font-family: "Helvetica Neue", Arial, sans-serif; }
    
    /* [HUD] ヘッドアップディスプレイ: 画面左上のステータス・グラフ表示領域 */
    #hud {
      position: absolute; top: 10px; left: 10px; z-index: 1000;
      background: rgba(0, 0, 0, 0.6); /* 背景を半透明の黒にし、文字の視認性を確保 */
      padding: 10px; border-radius: 8px; color: white; pointer-events: none;
    }
    #status { font-size: 14px; margin-bottom: 5px; font-weight: bold; }
    .status-ok { color: #00FF00; } /* 接続成功時: 緑文字 */
    .status-ng { color: #FF3B30; } /* 切断時: 赤文字 */
    
    #graphCanvas { background: rgba(0, 0, 0, 0.3); border: 1px solid #888; display: block; }
    
    /* 回路記号テクスチャ生成用のCanvas（画面には表示せず、内部処理で使用） */
    .symbol-canvas { display: none; }

    /* [UI] BLE接続ボタン */
    #connectBtn {
      position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%);
      padding: 12px 25px; font-size: 16px; font-weight: bold; color: white;
      background-color: #007AFF; border: none; border-radius: 30px;
      z-index: 2000; pointer-events: auto; cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }

    /* [UI] 表示切り替えボタン群 (左下) */
    #controls {
      position: absolute; bottom: 20px; left: 10px; z-index: 2000;
      display: flex; gap: 10px; pointer-events: auto;
    }
    .toggle-btn {
      padding: 10px 15px; font-size: 14px; font-weight: bold; color: white;
      background-color: #333; border: 2px solid #555; border-radius: 8px;
      cursor: pointer; transition: background 0.3s;
    }
    .toggle-btn.active { background-color: #34C759; border-color: #34C759; }
  </style>

  <script>
    /* ================================================================================
       [グローバル変数]
       - 異なるコンポーネント間（AR描画処理とBLE通信処理）でデータを共有するために使用
       ================================================================================ */
    window.currentValueGlobal = 0.0; // 受信した電流値 (単位: A)
    window.voltageValueGlobal = 0.0; // 受信した電圧値 (単位: V)
    window.showFlowGlobal = true;    // 回路表示のON/OFFフラグ

    /* * コンポーネント: canvas-updater
     * 役割: Canvasに描画した回路記号を、A-Frameの3Dオブジェクトのテクスチャとして反映させる
     * 理由: WebGLでは動的に生成した画像の反映に明示的な更新フラグ(needsUpdate)が必要なため
     */
    AFRAME.registerComponent('canvas-updater', {
      init: function() {
        this.el.sceneEl.addEventListener('loaded', () => {
          const maps = ['#cv-batt', '#cv-res', '#cv-led'];
          maps.forEach(id => {
            const el = document.querySelector(id);
            if(el) el.needsUpdate = true;
          });
          // iOS等のブラウザでの描画遅延対策として、1秒後に再度更新をかける
          setTimeout(() => {
             document.querySelectorAll('a-plane[material]').forEach(plane => {
                 if(plane.getObject3D('mesh').material.map) {
                     plane.getObject3D('mesh').material.map.needsUpdate = true;
                 }
             });
          }, 1000);
        });
      }
    });

    /* * コンポーネント: circuit-animator
     * 役割: 
     * 1. マーカー間を結ぶ導線（シリンダー）の描画
     * 2. 電流値に応じた電子流（粒子）のアニメーション制御
     * 3. 通電状態に応じた導線の色変更 (赤/緑)
     */
    AFRAME.registerComponent('circuit-animator', {
      init: function () {
        this.wires = [];     // 導線オブジェクト配列
        this.particles = []; // 粒子オブジェクト配列
        this.timeOffset = 0; // アニメーション用タイマー
        
        // 1区間あたりの最大粒子数（密度表現の滑らかさに関わる）
        const MAX_PARTICLES = 30;

        // 3つの区間 (Bat->Res, Res->LED, LED->Bat) のオブジェクトを生成
        for (let i = 0; i < 3; i++) {
          // --- 導線 (Cylinder) ---
          let wire = document.createElement('a-cylinder');
          wire.setAttribute('color', '#FF0000'); // 初期状態は赤(未接続)
          wire.setAttribute('radius', '0.02');   // 視認性の良い太さ
          wire.setAttribute('visible', 'false');
          this.el.sceneEl.appendChild(wire);
          this.wires.push(wire);

          // --- 電子流粒子 (Sphere) ---
          let segmentParticles = [];
          for(let j=0; j < MAX_PARTICLES; j++){
            let p = document.createElement('a-sphere');
            p.setAttribute('color', '#FFFF00'); // 黄色
            p.setAttribute('radius', '0.04');
            p.setAttribute('visible', 'false');
            
            // [分散表示ロジック]
            // 各粒子に0.0〜1.0のランクを付与し、電流密度に応じて表示/非表示を切り替える。
            // 黄金比を用いることで、ランダムかつ均等な分布を実現。
            p.densityRank = (j * 0.61803398875) % 1.0; 
            
            this.el.sceneEl.appendChild(p);
            segmentParticles.push(p);
          }
          this.particles.push(segmentParticles);
        }

        // マーカー要素の取得
        this.m6 = document.querySelector('#marker-batt');
        this.m0 = document.querySelector('#marker-res');
        this.m1 = document.querySelector('#marker-led');
      },

      tick: function (time, timeDelta) {
        // 表示OFF、またはマーカーが認識されていない場合は描画しない
        if (!window.showFlowGlobal || !this.m6 || !this.m0 || !this.m1 || 
            !this.m6.object3D.visible || !this.m0.object3D.visible || !this.m1.object3D.visible) {
          this.wires.forEach(w => w.setAttribute('visible', 'false'));
          this.particles.forEach(arr => arr.forEach(p => p.setAttribute('visible', 'false')));
          return;
        }

        // マーカーの3次元座標を取得 (y+=0.02 で少し浮かせる)
        let p6 = new THREE.Vector3(); this.m6.object3D.getWorldPosition(p6); p6.y += 0.02;
        let p0 = new THREE.Vector3(); this.m0.object3D.getWorldPosition(p0); p0.y += 0.02;
        let p1 = new THREE.Vector3(); this.m1.object3D.getWorldPosition(p1); p1.y += 0.02;

        // アニメーション進行 (一定速度)
        this.timeOffset += 0.003; 

        // [状態判定]
        let I = window.currentValueGlobal; // 電流(A)
        
        // 閾値: 0.1mA (0.0001A)
        // これ以上流れていれば「接続(緑)」、それ以下なら「切断(赤)」
        let isConnected = (I > 0.0001);
        let wireColor = isConnected ? '#00FF00' : '#FF0000';

        // 導線の色を一括更新
        this.wires.forEach(w => w.setAttribute('color', wireColor));

        // [密度計算] (Proportional Density)
        // 基準値: 20mA (0.02A) を密度100%とする
        let maxCurrentRef = 0.02; 
        let densityRatio = 0;

        if (isConnected) {
            densityRatio = I / maxCurrentRef;
            if (densityRatio > 1.0) densityRatio = 1.0; // 上限キャップ
        } else {
            densityRatio = 0; // 未接続時は粒を表示しない
        }

        // 各区間の描画更新
        this.updateSegment(0, p6, p0, densityRatio);
        this.updateSegment(1, p0, p1, densityRatio);
        this.updateSegment(2, p1, p6, densityRatio);
      },

      // 区間ごとの描画処理
      updateSegment: function(index, start, end, densityRatio) {
        // 導線の配置（位置・回転・長さ）
        let wire = this.wires[index];
        wire.setAttribute('visible', 'true');
        // ※色はtick内で更新済み
        
        let dist = start.distanceTo(end);
        wire.setAttribute('height', dist);
        let mid = start.clone().lerp(end, 0.5);
        wire.setAttribute('position', mid);
        wire.object3D.lookAt(end);
        wire.object3D.rotateX(Math.PI / 2); // Cylinderを寝かせる

        // 粒子の配置
        let parts = this.particles[index];
        parts.forEach((p, i) => {
            // 現在の密度率(densityRatio)と比較して表示判定
            if (densityRatio > 0 && p.densityRank < densityRatio) {
                p.setAttribute('visible', 'true');
                
                // 位置の線形補間
                let progress = (this.timeOffset + (i / parts.length)) % 1.0;
                let pos = start.clone().lerp(end, progress);
                p.setAttribute('position', pos);
            } else {
                p.setAttribute('visible', 'false');
            }
        });
      }
    });
  </script>
</head>

<body>
  <button id="connectBtn">Connect ESP32</button>

  <div id="controls">
    <button id="btnFlow" class="toggle-btn active" onclick="toggleFlow()">Circuit: ON</button>
    <button id="btnInfo" class="toggle-btn active" onclick="toggleInfo()">Values: ON</button>
  </div>

  <div id="hud">
    <div id="status">Status: <span id="statusText" class="status-ng">Disconnected</span></div>
    <canvas id="graphCanvas" width="300" height="150"></canvas>
    <div style="font-size:10px; color:#ccc; margin-top:2px;">Red: Voltage / Blue: Current</div>
  </div>

  <canvas id="cv-batt" class="symbol-canvas" width="256" height="256"></canvas>
  <canvas id="cv-res" class="symbol-canvas" width="256" height="256"></canvas>
  <canvas id="cv-led" class="symbol-canvas" width="256" height="256"></canvas>


  <a-scene embedded arjs='sourceType: webcam; detectionMode: mono_and_matrix; matrixCodeType: 3x3; debugUIEnabled: false;' circuit-animator canvas-updater>
    
    <a-assets>
      <canvas id="cv-batt-asset" src="#cv-batt"></canvas>
      <canvas id="cv-res-asset" src="#cv-res"></canvas>
      <canvas id="cv-led-asset" src="#cv-led"></canvas>
    </a-assets>

    <a-marker id="marker-batt" type='barcode' value='6'>
       <a-entity id="batteryInfo">
         <a-plane position="0 0.1 -0.5" rotation="-90 0 0" width="1" height="1" material="src: #cv-batt; transparent:true; opacity: 1;"></a-plane>
       </a-entity>
    </a-marker>

    <a-marker id="marker-res" type='barcode' value='0'>
       <a-entity id="resistorInfo">
         <a-plane position="0 0.1 -0.5" rotation="-90 0 0" width="1" height="1" material="src: #cv-res; transparent:true; opacity: 1;"></a-plane>
         
         <a-text id="currText" value="--- mA" color="yellow" position="0 0.02 0.2" rotation="-90 0 0" align="center" scale="3 3 3"></a-text>
         <a-text id="resText" value="R: ---" color="#00FF00" position="0 0.02 0.7" rotation="-90 0 0" align="center" scale="2.5 2.5 2.5"></a-text>
       </a-entity>
    </a-marker>

    <a-marker id="marker-led" type='barcode' value='1'>
       <a-entity id="ledInfo">
         <a-plane position="0 0.1 -0.5" rotation="-90 0 0" width="1" height="1" material="src: #cv-led; transparent:true; opacity: 1;"></a-plane>
         <a-text id="voltText" value="--- V" color="#FF3B30" position="0 0.02 0.3" rotation="-90 0 0" align="center" scale="3 3 3"></a-text>
       </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    // BLE UUID設定
    const serviceUuid = "4FAF0001-A428-4034-B095-81E5B9420000";
    const targetUuid  = "BEB5483E-36E1-4688-B7F5-EA07361B26A8";
    
    let myBLE, myCharacteristic;
    let dataHistory = []; 
    const maxDataPoints = 100;
    let showInfo = true;

    // 初期化処理
    function setup() {
      noCanvas();
      myBLE = new p5ble();
      
      const connectBtn = select("#connectBtn");
      if (connectBtn) connectBtn.mousePressed(connectToBle);
      
      drawGraph();      
      drawAllSymbols(); 
    }

    /* * Canvas APIを用いた回路記号描画
     * 画像ファイルを使用せず、コードで直接描画することで環境依存バグを回避
     */
    function drawAllSymbols() {
      // 1. Battery (電池)
      let c = document.getElementById('cv-batt'); let ctx = c.getContext('2d');
      ctx.fillStyle = 'white'; ctx.fillRect(0,0,256,256);
      ctx.lineWidth = 10; ctx.strokeStyle = 'black'; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(0, 128); ctx.lineTo(100, 128); ctx.stroke();
      ctx.lineWidth = 15; ctx.beginPath(); ctx.moveTo(100, 60); ctx.lineTo(100, 196); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(156, 90); ctx.lineTo(156, 166); ctx.stroke();
      ctx.lineWidth = 10; ctx.beginPath(); ctx.moveTo(156, 128); ctx.lineTo(256, 128); ctx.stroke();
      ctx.fillStyle = 'black'; ctx.font = 'bold 40px Arial'; ctx.textAlign = 'center';
      ctx.fillText("Battery", 128, 40);

      // 2. Variable Resistor (可変抵抗)
      c = document.getElementById('cv-res'); ctx = c.getContext('2d');
      ctx.fillStyle = 'white'; ctx.fillRect(0,0,256,256);
      ctx.lineWidth = 10; ctx.strokeStyle = 'black'; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(0, 128); ctx.lineTo(40, 128);
      ctx.lineTo(60, 80); ctx.lineTo(100, 176);
      ctx.lineTo(140, 80); ctx.lineTo(180, 176);
      ctx.lineTo(200, 128); ctx.lineTo(256, 128);
      ctx.stroke();
      // 可変を示す矢印
      ctx.beginPath(); ctx.moveTo(80, 200); ctx.lineTo(180, 50); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(180, 50); ctx.lineTo(160, 60); ctx.moveTo(180, 50); ctx.lineTo(170, 80); ctx.stroke();
      ctx.fillStyle = 'black'; ctx.font = 'bold 35px Arial'; ctx.textAlign = 'center';
      ctx.fillText("Var. Resistor", 128, 40);

      // 3. LED (発光ダイオード)
      c = document.getElementById('cv-led'); ctx = c.getContext('2d');
      ctx.fillStyle = 'white'; ctx.fillRect(0,0,256,256);
      ctx.lineWidth = 8; ctx.strokeStyle = 'black';
      ctx.beginPath(); ctx.moveTo(128, 170); ctx.lineTo(80, 90); ctx.lineTo(176, 90); ctx.closePath(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(80, 170); ctx.lineTo(176, 170); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(128, 90); ctx.lineTo(128, 60); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(128, 170); ctx.lineTo(128, 200); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(180, 140); ctx.lineTo(220, 180); 
      ctx.moveTo(210, 180); ctx.lineTo(220, 180); ctx.lineTo(220, 170); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(190, 120); ctx.lineTo(230, 160);
      ctx.moveTo(220, 160); ctx.lineTo(230, 160); ctx.lineTo(230, 150); ctx.stroke();
      ctx.fillStyle = 'black'; ctx.font = 'bold 40px Arial'; ctx.textAlign = 'center';
      ctx.fillText("LED", 128, 40);
    }

    // --- UI操作関数 ---
    function toggleFlow() {
      window.showFlowGlobal = !window.showFlowGlobal;
      const btn = document.getElementById('btnFlow');
      if (window.showFlowGlobal) {
        btn.classList.add('active'); btn.innerText = "Circuit: ON";
      } else {
        btn.classList.remove('active'); btn.innerText = "Circuit: OFF";
      }
    }

    function toggleInfo() {
      showInfo = !showInfo;
      const btn = document.getElementById('btnInfo');
      const entities = [
        document.querySelector('#resistorInfo'),
        document.querySelector('#ledInfo'),
        document.querySelector('#batteryInfo')
      ];
      if (showInfo) {
        btn.classList.add('active'); btn.innerText = "Values: ON";
        entities.forEach(el => { if(el) el.setAttribute('visible', 'true'); });
      } else {
        btn.classList.remove('active'); btn.innerText = "Values: OFF";
        entities.forEach(el => { if(el) el.setAttribute('visible', 'false'); });
      }
    }

    // --- BLE接続処理 ---
    function connectToBle() {
      myBLE.connect(serviceUuid, gotCharacteristics);
    }

    function gotCharacteristics(error, characteristics) {
      if (error) { console.error(error); return; }
      select("#connectBtn").hide();
      const statusText = select("#statusText");
      statusText.html("Connected");
      statusText.class("status-ok");
      
      for (let i = 0; i < characteristics.length; i++) {
        if (characteristics[i].uuid.toLowerCase() == targetUuid.toLowerCase()) {
          myCharacteristic = characteristics[i];
          setInterval(readDataLoop, 500);
          break;
        }
      }
    }

    function readDataLoop() {
      if (myBLE.isConnected() && myCharacteristic) {
        myBLE.read(myCharacteristic, 'string', handleData);
      } else {
        const statusText = select("#statusText");
        if(statusText) { statusText.html("Disconnected"); statusText.class("status-ng"); }
      }
    }

    /* * データ受信ハンドラ
     * 役割: センサー値のパース、単位変換、表示更新、グラフ履歴追加
     */
    function handleData(error, data) {
      if (error || !data) return;
      let values = String(data).split(',');
      if (values.length >= 2) {
        let rawVoltage = parseFloat(values[0]);
        let rawCurrent = parseFloat(values[1]);
        
        // [ノイズフィルタ] 負の値は0.0に補正
        if (rawCurrent < 0) rawCurrent = 0.0;
        
        window.currentValueGlobal = rawCurrent;
        window.voltageValueGlobal = rawVoltage;

        // 表示更新 (mA)
        let current_mA = (rawCurrent * 1000).toFixed(3); 
        document.querySelectorAll('#voltText').forEach(el => el.setAttribute('value', rawVoltage + " V"));
        document.querySelectorAll('#currText').forEach(el => el.setAttribute('value', current_mA + " mA"));
        
        // オームの法則計算 (R = V / I)
        // ゼロ除算防止のため、閾値(1uA)以上の場合のみ計算
        let resistanceText = "---";
        if (rawCurrent > 0.000001) { 
            let R = rawVoltage / rawCurrent;
            if (R >= 1000) { 
                resistanceText = (R / 1000).toFixed(2) + " k-ohm"; 
            } else { 
                resistanceText = R.toFixed(0) + " ohm"; 
            }
        } else { 
            resistanceText = "OPEN"; 
        }
        document.querySelectorAll('#resText').forEach(el => el.setAttribute('value', "R: " + resistanceText));

        // グラフ更新
        dataHistory.push({ v: rawVoltage, c: rawCurrent });
        if (dataHistory.length > maxDataPoints) dataHistory.shift();
        drawGraph();
      }
    }

    // グラフ描画 (Voltage: Red, Current: Blue)
    function drawGraph() {
      const canvas = document.getElementById('graphCanvas');
      const ctx = canvas.getContext('2d');
      const w = canvas.width; const h = canvas.height;
      ctx.clearRect(0, 0, w, h);
      
      // グリッド線
      ctx.strokeStyle = '#555'; ctx.lineWidth = 1; ctx.beginPath();
      for(let i=1; i<4; i++) { let y = (h / 4) * i; ctx.moveTo(0, y); ctx.lineTo(w, y); }
      ctx.stroke();

      if (dataHistory.length < 2) return;
      
      const maxVolt = 3.5; 
      const maxCurr = 0.02; 

      // 電圧線
      ctx.beginPath(); ctx.strokeStyle = '#FF3B30'; ctx.lineWidth = 2;
      for (let i = 0; i < dataHistory.length; i++) {
        let x = (i / (maxDataPoints - 1)) * w; 
        let y = h - (dataHistory[i].v / maxVolt) * h;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();

      // 電流線
      ctx.beginPath(); ctx.strokeStyle = '#007AFF'; ctx.lineWidth = 2;
      for (let i = 0; i < dataHistory.length; i++) {
        let x = (i / (maxDataPoints - 1)) * w;
        let val = dataHistory[i].c; 
        if (val > maxCurr) val = maxCurr;
        let y = h - (val / maxCurr) * h;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
  </script>
</body>
</html>
